<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brighton Ng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #111;
    }

    body {
      font-family: "Figtree", sans-serif;
      display: flex;
      justify-content: center;
      padding: 72px 24px;
      line-height: 1.50;
    }

    main {
      width: min(100%, 800px);
    }

    p {
      margin: 0 0 12px 0;
    }

    .bears {
      display: flex;
      gap: 16px;
    }

    .bears img {
      flex: 1;
      min-width: 0;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <main>
    <p><a href="./index.html">home</a></p>
    <br>
    <div class="bears">
      <img src="./assets/bear-front.jpg" alt="Front of my bear Brother">
      <img src="./assets/bear-back.jpg" alt="Back of my bear Brother">
    </div>
    <br>
    <p>This is my bear Brother</p>
  </main>
</body>
</html>
